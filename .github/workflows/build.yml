name: SyriaMap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت أدوات Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: فك المشروع الأخير
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "SyriaMap_FINAL_LATEST_FEATURES.zip" -d build-src

          echo "محتويات المشروع:"
          find build-src -maxdepth 3 -type f | head -100

      - name: العثور على مجلد المشروع
        run: |
          SETTINGS=$(find build-src -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: لم يتم العثور على settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "المشروع:"
          echo "$PROJECT_DIR"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: SyriaMap-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
